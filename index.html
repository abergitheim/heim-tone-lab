<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HEIM.Tone.lab</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<meta name="apple-mobile-web-app-title" content="Tone.lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;500;700&family=Chivo+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#FFB020;
  --ac-dark:color-mix(in srgb, var(--ac) 70%, #000);
  --bg:#0A0C09;
  --panel:#0D110C;
  --line:#223021;
  --grid:#182417;
  --tx:#E6F0E2;
  --tx2:#7C8C77;
  --tx-dis:#556052;
  --on-ac:#0A0C09;
  --mono:'Chivo Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --sans:'Chivo', system-ui, -apple-system, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#000;
  font-family:var(--sans);
  color:var(--tx);
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.app{
  width:100%;
  max-width:390px;
  height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
/* Gerätrahmen nur auf grossen Screens (Desktop-Vorschau) */
@media (min-width:480px) and (min-height:900px){
  .app{
    height:844px;
    border-radius:44px;
    border:1px solid var(--line);
    box-shadow:0 0 0 8px #000, 0 30px 80px rgba(0,0,0,.8);
  }
}

/* ---------- Statusleiste + Kopf ---------- */
.status{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 20px 3px;
  font-family:var(--mono);font-size:11px;color:var(--tx2);
}
.status .icons{display:flex;align-items:center;gap:8px}
.status .dots{letter-spacing:1px;font-size:8px}
.status .bat{display:inline-block;width:5px;height:10px;border-radius:2px;background:var(--tx2)}
header{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:3px 20px 5px;
  border-bottom:1px solid var(--line);
}
header h1{
  font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:1.5px;color:var(--ac);
}
header .meta{font-family:var(--mono);font-size:11px;color:var(--tx2);letter-spacing:1px}

/* ---------- Content-Grid ---------- */
.content{
  flex:1;
  display:flex;flex-direction:column;gap:12px;
  padding:8px 20px 20px;
  min-height:0;
  overflow-y:auto;
}
.content>*{flex-shrink:0}  /* Panels nie zusammenquetschen */

/* ---------- Panels mit Raster (Ton + Stimme) ---------- */
.scope,.mic{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 20px 0;
  overflow:hidden;
}
.scope::before,.mic::before{
  content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
}
.scope>*,.mic>*{position:relative}
.readout{
  display:flex;justify-content:space-between;align-items:flex-end;
}
.note{
  font-family:var(--mono);font-weight:700;font-size:62px;line-height:.95;
  color:var(--ac);
  text-shadow:0 0 22px color-mix(in srgb, var(--ac) 55%, transparent);
  font-variant-numeric:tabular-nums;
}
.freq{
  font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;
  color:var(--ac);
  text-shadow:0 0 16px color-mix(in srgb, var(--ac) 45%, transparent);
  font-variant-numeric:tabular-nums;
  cursor:pointer;
}
.freq small{font-size:16px;font-weight:700}
#freqEdit{
  font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;
  color:var(--ac);background:transparent;border:none;
  border-bottom:2px solid var(--ac);
  width:5.5ch;text-align:right;padding:0;margin:0;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:text;user-select:text;
  outline:none;-webkit-appearance:none;appearance:none;
  caret-color:var(--ac);
}
.scope-foot{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--line);
  margin-top:12px;
  padding:12px 0 14px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.scope-foot .lbl{font-size:11px;color:var(--tx2);letter-spacing:1px;margin-right:8px}
.scope-foot .soll{font-size:16px;font-weight:500;color:var(--tx)}
.scope-foot .delta{font-size:16px;font-weight:700;color:var(--ac)}

/* ---------- Stimme (Mikrofon-Tonhöhe) ---------- */
.mic{padding:12px 20px 12px}
.mic-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--tx2);
  margin-bottom:6px;
}
.mic-head .state{color:var(--ac)}
.mic .note{font-size:46px}
.mic .freq{font-size:26px;cursor:default}
.mic .freq small{font-size:13px}
.mic.off .note,.mic.off .freq,.mic.idle .note,.mic.idle .freq{color:var(--tx-dis);text-shadow:none}
.mic.off .mic-head .state{color:var(--tx-dis)}
.meter{
  position:relative;height:14px;margin-top:10px;
  border-radius:3px;background:var(--grid);
}
.meter .zone{
  position:absolute;top:0;bottom:0;
  background:color-mix(in srgb, var(--ac) 22%, transparent);
}
.meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--tx2)}
.meter .needle{
  position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;
  border-radius:2px;background:var(--ac);
  box-shadow:0 0 8px var(--ac);
  opacity:0;transition:left .08s linear;
}
.meter.live .needle{opacity:1}
.meter-scale{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:5px;
  font-family:var(--mono);font-size:10px;color:var(--tx2);
  font-variant-numeric:tabular-nums;
}
.meter-scale .ct{font-size:13px;font-weight:700;color:var(--ac)}
.cmp{
  margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line);
  min-height:28px;
  font-family:var(--mono);font-size:13px;letter-spacing:.5px;color:var(--tx2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cmp .lbl{font-size:11px;letter-spacing:1px;color:var(--tx2);margin-right:8px}
.cmp .res{color:var(--tx);font-weight:700}
.cmp.hit .res{color:var(--ac);text-shadow:0 0 10px color-mix(in srgb, var(--ac) 45%, transparent)}

/* ---------- Frequenz-Scrollrad ---------- */
.freqrow{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);
  border:1px solid var(--line);border-radius:6px;
  padding:2px 14px;
}
.freqrow .lbl{
  flex:0 0 auto;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--tx2);
}
#dial{
  flex:1;min-width:0;height:48px;display:block;
  touch-action:none;cursor:ew-resize;
}

/* ---------- Oktav-Auswahl ---------- */
.octrow{display:flex;align-items:center;gap:8px}
.octrow .lbl{
  font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--tx2);
  flex:0 0 auto;margin-right:2px;
}
.octcells{display:flex;gap:6px;flex:1}
.oct{
  flex:1;height:44px;
  border:1px solid var(--line);border-radius:3px;
  background:transparent;
  font-family:var(--mono);font-size:15px;font-weight:500;color:var(--tx2);
  cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.oct.edge{color:var(--tx-dis)}
.oct.on{
  background:var(--ac);border-color:var(--ac);
  color:var(--on-ac);font-weight:700;
  box-shadow:0 0 14px color-mix(in srgb, var(--ac) 40%, transparent);
}

/* ---------- Klaviatur (rollendes Band C0–B8) ---------- */
.kbd{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  height:156px;
}
.kscroll{
  height:100%;
  overflow-x:auto;overflow-y:hidden;
  touch-action:pan-x;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  cursor:grab;
}
.kscroll::-webkit-scrollbar{display:none}
.kstrip{position:relative;height:100%}
.wkey{
  position:absolute;top:0;bottom:0;width:36px;
  border:none;border-radius:0 0 5px 5px;
  background:linear-gradient(#DDE7D8, #B9C7B3);
  cursor:pointer;
  font-family:var(--mono);font-size:9px;font-weight:500;color:#2A3327;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:8px;
}
.wkey.c{font-weight:700;color:#0A0C09}
.wkey.on{
  background:linear-gradient(var(--ac), var(--ac-dark));
  color:var(--on-ac);font-weight:700;
  box-shadow:0 0 18px color-mix(in srgb, var(--ac) 55%, transparent);
}
.bkey{
  position:absolute;top:0;width:22px;height:60%;z-index:2;
  border:1px solid #000;border-radius:0 0 4px 4px;
  background:linear-gradient(#1A2418, #050705);
  cursor:pointer;
}
.bkey.on{
  background:linear-gradient(var(--ac), var(--ac-dark));
  border-color:var(--ac-dark);
  box-shadow:0 0 14px color-mix(in srgb, var(--ac) 55%, transparent);
}

/* ---------- Master-Regler ---------- */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  flex:1;height:24px;background:transparent;cursor:pointer;min-width:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right, var(--fill,var(--tx2)) var(--p,50%), var(--grid) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:24px;height:24px;margin-top:-10px;background:transparent;border:none;
}
input[type=range]::-moz-range-track{
  height:4px;border-radius:2px;
  background:linear-gradient(to right, var(--fill,var(--tx2)) var(--p,50%), var(--grid) var(--p,50%));
}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:transparent;border:none}
.masterrow{display:flex;align-items:center;gap:12px;padding:0 2px}
.masterrow .lbl{
  flex:0 0 auto;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--tx2);
}
.masterrow .pct{
  flex:0 0 44px;text-align:right;
  font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ac);
  font-variant-numeric:tabular-nums;
}
#master{--fill:var(--ac);height:28px}
#master::-webkit-slider-runnable-track{height:6px;border-radius:3px}
#master::-webkit-slider-thumb{
  width:20px;height:20px;margin-top:-7px;border-radius:4px;
  background:#E6F0E2;box-shadow:0 1px 4px rgba(0,0,0,.6);
}
#master::-moz-range-track{height:6px;border-radius:3px}
#master::-moz-range-thumb{
  width:20px;height:20px;border-radius:4px;background:#E6F0E2;
  border:none;box-shadow:0 1px 4px rgba(0,0,0,.6);
}

/* ---------- Fusszeile (fix, nicht Teil des scrollenden Inhalts) ---------- */
.footer{
  flex-shrink:0;
  display:flex;gap:10px;
  padding:12px 20px 14px;
  border-top:1px solid var(--line);
}
#power,#mic{
  height:64px;
  border-radius:10px;
  font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:4px;
  cursor:pointer;
}
#power{flex:1}
#power.running{
  background:transparent;
  border:2px solid var(--ac);
  color:var(--ac);
  box-shadow:0 0 18px color-mix(in srgb, var(--ac) 25%, transparent),
             inset 0 0 14px color-mix(in srgb, var(--ac) 12%, transparent);
}
#power.stopped{
  background:linear-gradient(var(--ac), var(--ac-dark));
  border:2px solid var(--ac);
  color:var(--on-ac);
  box-shadow:0 0 22px color-mix(in srgb, var(--ac) 35%, transparent);
}
#mic{
  flex:0 0 112px;
  font-size:15px;letter-spacing:3px;
  background:transparent;
  border:2px solid var(--line);
  color:var(--tx2);
}
#mic.on{
  border-color:var(--ac);
  color:var(--ac);
  box-shadow:0 0 18px color-mix(in srgb, var(--ac) 25%, transparent),
             inset 0 0 14px color-mix(in srgb, var(--ac) 12%, transparent);
}
</style>
</head>
<body>
<div class="app">

  <div class="status">
    <span id="clock">9:41</span>
    <span class="icons"><span class="dots">●●●</span><span class="bat"></span></span>
  </div>

  <header>
    <h1>HEIM.TONE.LAB</h1>
    <span class="meta">v2.1 · REC</span>
  </header>

  <div class="content">

    <section class="scope">
      <div class="readout">
        <span class="note" id="noteName">A3</span>
        <span class="freq"><span id="freqVal">220</span><small>Hz</small></span>
      </div>
      <div class="scope-foot">
        <span><span class="lbl">SOLL</span><span class="soll" id="sollVal">220,00 Hz</span></span>
        <span><span class="lbl">Δ</span><span class="delta" id="deltaVal">+0 ct</span></span>
      </div>
    </section>

    <section class="mic off" id="micPanel">
      <div class="mic-head"><span>STIMME</span><span class="state" id="micState">AUS</span></div>
      <div class="readout">
        <span class="note" id="sungNote">--</span>
        <span class="freq"><span id="sungHz">--</span><small>Hz</small></span>
      </div>
      <div class="meter" id="meter">
        <div class="zone" id="zone"></div>
        <div class="mid"></div>
        <div class="needle" id="needle"></div>
      </div>
      <div class="meter-scale"><span>−50</span><span class="ct" id="sungCt"></span><span>+50 ct</span></div>
      <div class="cmp" id="cmp"></div>
    </section>

    <section class="freqrow">
      <span class="lbl">FREQ</span>
      <canvas id="dial"></canvas>
    </section>

    <section class="octrow">
      <span class="lbl">OCT</span>
      <div class="octcells" id="octcells"></div>
    </section>

    <section class="kbd">
      <div class="kscroll" id="kscroll"><div class="kstrip" id="kstrip"></div></div>
    </section>

    <section class="masterrow">
      <span class="lbl">MASTER</span>
      <input type="range" id="master" min="0" max="100" value="100">
      <span class="pct" id="masterPct">100%</span>
    </section>

  </div>

  <div class="footer">
    <button id="power" class="stopped">▶&nbsp;&nbsp;START</button>
    <button id="mic">MIC</button>
  </div>
</div>

<script>
"use strict";

/* ================= Konfiguration ================= */
const A4 = 440;            // Kammerton, konfigurierbar
const N_HARM = 64;         // Harmonische für PeriodicWave
/* Klangfarbe seit v2.0 fest (bewährte Standardmischung, kein Regler mehr).
   Werte sind Anteile; sie werden durch ihre Summe geteilt. */
const MIX = { sine: 80, tri: 20, saw: 0 };
const HIT_CT = 10;         // Toleranz «getroffen» in Cent (±)
const MIC_FMIN = 60;       // tiefste erkannte Stimmfrequenz (Hz) — reicht unter E2 (Bass)
const MIC_FMAX = 1500;     // höchste erkannte Stimmfrequenz (Hz)
const MIC_RMS_MIN = 0.01;  // darunter gilt das Signal als Stille
const MIC_HOLD_MS = 400;   // so lange bleibt der letzte Wert nach Verstummen stehen

/* ================= Zustand =================
   Die Frequenz ist die einzige Quelle der Wahrheit.
   Tonmodus (Klaviatur/Oktave) und Frequenzmodus (Scrollrad)
   setzen beide nur state.freq; alles andere wird abgeleitet. */
const state = {
  freq: 220,               // Hz (A3)
  master: 100,
  playing: false,
  micOn: false,
};

const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

/* ================= Formatierung (dt. Komma) ================= */
const de = (x, d) => x.toFixed(d).replace('.', ',');
const signed = (x, txt) => (x >= 0 ? '+' : '−') + txt;

/* ================= Tonhöhen-Mathematik ================= */
const freqOfMidi = m => A4 * Math.pow(2, (m - 69) / 12);
const midiOfFreq = f => 69 + 12 * Math.log2(f / A4);
const noteName = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const MIDI_MIN = 12;                                 // C0
const MIDI_MAX = 119;                                // B8 (Ende der Klaviatur)
const FREQ_MIN = freqOfMidi(MIDI_MIN);               // ≈ 16,35 Hz
const FREQ_MAX = 20000;                              // Hörgrenze
const clampFreq = f => Math.min(FREQ_MAX, Math.max(FREQ_MIN, f));

/* ================= DOM-Aufbau ================= */
const $ = id => document.getElementById(id);

/* Oktaven 0–8 */
const octEls = [];
for (let o = 0; o <= 8; o++){
  const b = document.createElement('button');
  b.className = 'oct' + ((o === 0 || o >= 7) ? ' edge' : '');
  b.textContent = o;
  b.addEventListener('pointerdown', () => {
    const m = Math.round(midiOfFreq(state.freq));
    state.freq = freqOfMidi(12 * (o + 1) + (((m % 12) + 12) % 12));  // Notenklasse behalten, Oktave wechseln
    onPitchChange('oct');
  });
  $('octcells').appendChild(b);
  octEls.push(b);
}

/* Klaviatur: ein durchgehendes Band C0–B8, seitlich verschiebbar.
   Töne werden per 'click' ausgelöst (= beim Loslassen): So unterscheidet der
   Browser selbst zwischen Antippen (Ton) und Wischen (Band rollt). */
const KEY_W = 36, KEY_GAP = 2, KEY_P = KEY_W + KEY_GAP, BKEY_W = 22;
const kscroll = $('kscroll'), kstrip = $('kstrip');
const keyEls = {};
let whiteCount = 0;
for (let m = MIDI_MIN; m <= MIDI_MAX; m++){
  const k = document.createElement('button');
  k.dataset.midi = m;
  if (NAMES[m % 12].length === 1){
    k.className = 'wkey' + (m % 12 === 0 ? ' c' : '');
    k.style.left = (whiteCount * KEY_P) + 'px';
    k.textContent = noteName(m);
    whiteCount++;
  } else {
    k.className = 'bkey';
    k.style.left = (whiteCount * KEY_P - KEY_GAP / 2 - BKEY_W / 2) + 'px';
  }
  keyEls[m] = k;
  kstrip.appendChild(k);
}
kstrip.style.width = (whiteCount * KEY_P - KEY_GAP) + 'px';

/* Maus (Mac): Band per Ziehen verschieben — auf dem iPhone rollt es nativ. */
let mouseDrag = null, dragMoved = false;
kscroll.addEventListener('pointerdown', e => {
  dragMoved = false;
  if (e.pointerType !== 'mouse') return;
  mouseDrag = { x: e.clientX, s: kscroll.scrollLeft };
});
window.addEventListener('pointermove', e => {
  if (!mouseDrag) return;
  const dx = e.clientX - mouseDrag.x;
  if (Math.abs(dx) > 4) dragMoved = true;
  if (dragMoved) kscroll.scrollLeft = mouseDrag.s - dx;
});
window.addEventListener('pointerup', () => { mouseDrag = null; });

kstrip.addEventListener('click', e => {
  if (dragMoved){ dragMoved = false; return; }   // war ein Ziehen, kein Tippen
  const k = e.target.closest('button');
  if (!k) return;
  state.freq = freqOfMidi(+k.dataset.midi);
  onPitchChange('key');
});

/* Band so verschieben, dass die Oktave o links beginnt */
function scrollToOctave(o, smooth){
  const c = keyEls[12 * (Math.min(8, Math.max(0, o)) + 1)];
  kscroll.scrollTo({ left: c.offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
}
/* Nur verschieben, wenn die aktive Taste nicht sichtbar ist */
function ensureKeyVisible(m, smooth){
  const k = keyEls[m];
  if (!k) return;
  const l = k.offsetLeft, r = l + k.offsetWidth;
  const vl = kscroll.scrollLeft, vr = vl + kscroll.clientWidth;
  if (l >= vl && r <= vr) return;
  scrollToOctave(Math.floor(m / 12) - 1, smooth);
}

/* ================= Audio ================= */
let ctx = null, osc = null, gate = null, masterGain = null;

function ensureAudio(){
  if (ctx && ctx.state === 'closed') ctx = null;
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  gate = ctx.createGain();
  masterGain = ctx.createGain();
  gate.connect(masterGain).connect(ctx.destination);
  gate.gain.value = 0;
  masterGain.gain.value = masterLevel();
}

function masterLevel(){
  return Math.pow(state.master / 100, 2) * 0.9;
}

/* Klangfarbe: gewichtete Fourier-Summe aus Sinus/Dreieck/Sägezahn (fest: MIX) */
function buildWave(){
  const { sine, tri, saw } = MIX;
  const total = sine + tri + saw;
  const real = new Float32Array(N_HARM + 1);
  const imag = new Float32Array(N_HARM + 1);
  for (let n = 1; n <= N_HARM; n++){
    let b = 0;
    if (n === 1) b += sine;
    if (n % 2 === 1) b += tri * (8 / (Math.PI * Math.PI)) * Math.pow(-1, (n - 1) / 2) / (n * n);
    b += saw * (2 / Math.PI) * Math.pow(-1, n + 1) / n;
    imag[n] = b / total;
  }
  return ctx.createPeriodicWave(real, imag);
}

function start(){
  ensureAudio();
  ctx.resume();
  osc = ctx.createOscillator();
  osc.frequency.value = state.freq;
  osc.setPeriodicWave(buildWave());
  osc.connect(gate);
  osc.start();
  gate.gain.setTargetAtTime(1, ctx.currentTime, 0.02);
  state.playing = true;
}

function stop(){
  if (!ctx) return;
  const t = ctx.currentTime;
  gate.gain.setTargetAtTime(0, t, 0.03);
  const dying = osc;
  osc = null;
  if (dying) dying.stop(t + 0.25);
  state.playing = false;
}

/* ================= Mikrofon: Tonhöhe der Stimme (YIN) ================= */
let micStream = null, micSrc = null, analyser = null, micSink = null;
let micTimer = null, micBuf = null, yinBuf = null;
let pitchHist = [], sungMidi = null, lastHeard = 0, micMsg = '';

/* YIN-Algorithmus (de Cheveigné & Kawahara 2002): findet die Periode
   über die normierte Differenzfunktion — robust gegen Oktavfehler. */
function detectPitch(buf, sr){
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < MIC_RMS_MIN) return null;

  const tauMin = Math.max(2, Math.floor(sr / MIC_FMAX));
  const tauMax = Math.min(Math.floor(sr / MIC_FMIN), Math.floor(buf.length / 2));
  const W = Math.min(2048, buf.length - tauMax);   // Fenster ≥ 2 Perioden des tiefsten Tons
  if (!yinBuf || yinBuf.length < tauMax + 2) yinBuf = new Float32Array(tauMax + 2);
  const d = yinBuf;

  /* Differenzfunktion, kumulativ normiert — schrittweise berechnet und
     abgebrochen, sobald die erste Mulde unter der Schwelle gefunden ist
     (spart bei mittleren/hohen Tönen den Grossteil der Rechenzeit). */
  const TH = 0.15;
  const diff = t => { let s = 0; for (let i = 0; i < W; i++){ const x = buf[i] - buf[i + t]; s += x * x; } return s; };
  d[0] = 1;
  let run = 0, tau = -1;
  for (let t = 1; t <= tauMax; t++){
    const raw = diff(t);
    run += raw;
    d[t] = run > 0 ? raw * t / run : 1;
    if (tau < 0 && t > tauMin && d[t - 1] < TH && d[t] >= d[t - 1]){
      tau = t - 1;   // Talsohle erreicht
      break;
    }
  }
  if (tau >= tauMax - 1) tau = -1;
  if (tau < 0) return null;
  /* Parabolische Interpolation für Cent-Genauigkeit */
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a - 2 * b + c;
  const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
  const f = sr / (tau + shift);
  return (f >= MIC_FMIN && f <= MIC_FMAX) ? f : null;
}

function micTick(){
  if (!analyser) return;
  analyser.getFloatTimeDomainData(micBuf);
  const f = detectPitch(micBuf, ctx.sampleRate);
  const now = performance.now();
  if (f){
    pitchHist.push(midiOfFreq(f));
    if (pitchHist.length > 5) pitchHist.shift();
    /* Median der letzten Messungen: glättet Vibrato und Ausreisser */
    const s = pitchHist.slice().sort((x, y) => x - y);
    sungMidi = s[Math.floor(s.length / 2)];
    lastHeard = now;
  } else if (now - lastHeard > MIC_HOLD_MS){
    sungMidi = null;
    pitchHist = [];
  }
  renderMic();
}

/* Mikrofon-Freigabe nur einmal pro Sitzung anfragen: Der Stream bleibt nach
   dem Ausschalten von MIC offen und wird beim nächsten Einschalten wieder-
   verwendet. Erst wenn die App in den Hintergrund geht, wird er freigegeben. */
const micLive = () => micStream && micStream.getAudioTracks().some(t => t.readyState === 'live');

async function micStart(){
  micMsg = '';
  ensureAudio();
  ctx.resume();   // muss im Tipp-Ereignis passieren (iOS)
  if (!micLive()){
    micStream = null;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micMsg = 'Mikrofon nur über https verfügbar.';
      renderMic();
      return;
    }
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    try {
      /* Echounterdrückung bewusst AUS (seit v2.1): Sie drückte auf dem iPhone
         den Referenzton im Kopfhörer weg, sobald man singt. Folge: Über den
         Lautsprecher hört das Mikrofon den Ton mit → Kopfhörer verwenden. */
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (err){
      micMsg = err && err.name === 'NotAllowedError'
        ? 'Zugriff verweigert – in Safari unter «aA» erlauben.'
        : 'Mikrofon nicht verfügbar.';
      renderMic();
      return;
    }
  }
  micSrc = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;              // ≈ 85 ms Fenster — nötig für tiefe Bass-Töne
  micSink = ctx.createGain();
  micSink.gain.value = 0;               // stumm: Analyse muss angeschlossen sein, aber nie hörbar
  micSrc.connect(analyser);
  analyser.connect(micSink).connect(ctx.destination);
  micBuf = new Float32Array(analyser.fftSize);
  pitchHist = []; sungMidi = null; lastHeard = 0;
  state.micOn = true;
  micTimer = setInterval(micTick, 50);  // 20 Messungen pro Sekunde
  render();
}

/* MIC aus: Messung stoppen, Stream aber offen lassen (keine neue Rückfrage).
   release = true: Stream wirklich freigeben (App im Hintergrund). */
function micStop(release){
  if (micTimer){ clearInterval(micTimer); micTimer = null; }
  if (micSrc){ micSrc.disconnect(); micSrc = null; }
  if (analyser){ analyser.disconnect(); analyser = null; }
  if (micSink){ micSink.disconnect(); micSink = null; }
  if (release === true && micStream){
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'auto'; } catch (e) {}
  }
  state.micOn = false;
  sungMidi = null; pitchHist = [];
  render();
}

/* App-Wechsel: iOS unterbricht Audio und Mikrofon im Hintergrund, und ein
   unterbrochener AudioContext erholt sich oft nicht mehr. Deshalb beim
   Verlassen alles sauber beenden und den AudioContext schliessen — beim
   nächsten START/MIC entsteht ein frischer. */
function suspendAll(){
  if (state.micOn || micStream) micStop(true);
  if (osc){ try { osc.stop(); } catch (e) {} osc = null; }
  state.playing = false;
  if (ctx){ try { ctx.close(); } catch (e) {} }
  ctx = null; gate = null; masterGain = null;
  render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) suspendAll(); });
window.addEventListener('pagehide', suspendAll);

/* ================= Events / Rendering ================= */
function onPitchChange(src){
  if (osc) osc.frequency.setTargetAtTime(state.freq, ctx.currentTime, 0.01);
  render();
  /* Klaviatur nachführen — nie bei Tippen auf die Klaviatur selbst
     (sonst springt das Band unter dem Finger weg) */
  const m = Math.round(midiOfFreq(state.freq));
  if (src === 'oct') scrollToOctave(Math.floor(m / 12) - 1, true);
  else if (src !== 'key') ensureKeyVisible(m, src !== 'dial');
}

$('master').addEventListener('input', e => {
  state.master = +e.target.value;
  if (masterGain) masterGain.gain.setTargetAtTime(masterLevel(), ctx.currentTime, 0.02);
  render();
});

$('power').addEventListener('click', () => {
  if (state.playing) stop(); else start();
  render();
});

$('mic').addEventListener('click', () => {
  if (state.micOn) micStop(false); else micStart();
});

let activeKey = null;
function render(){
  /* Alles aus state.freq ableiten: nächste Note = SOLL, Abstand = Δ ct */
  const f = state.freq;
  const m = Math.round(midiOfFreq(f));
  const soll = freqOfMidi(m);
  const cents = Math.round(1200 * Math.log2(f / soll));
  const noteOct = Math.floor(m / 12) - 1;

  /* Display */
  $('noteName').textContent = noteName(m);
  $('freqVal').textContent = Math.abs(f - Math.round(f)) < 0.05 ? String(Math.round(f)) : de(f, 1);
  $('sollVal').textContent = de(soll, 2) + ' Hz';
  $('deltaVal').textContent = signed(cents, Math.abs(cents) + ' ct');

  /* Oktaven: Oktave des aktuellen Tons */
  octEls.forEach((b, o) => b.classList.toggle('on', o === noteOct));

  /* Aktive Taste */
  const k = keyEls[m] || null;
  if (activeKey !== k){
    if (activeKey) activeKey.classList.remove('on');
    if (k) k.classList.add('on');
    activeKey = k;
  }

  /* Master */
  $('masterPct').textContent = state.master + '%';
  if (+$('master').value !== state.master) $('master').value = state.master; // laufenden Drag nie durch Rückschreiben stören
  $('master').style.setProperty('--p', state.master + '%');

  /* Power- und MIC-Knopf */
  const p = $('power');
  p.className = state.playing ? 'running' : 'stopped';
  p.innerHTML = state.playing ? '■&nbsp;&nbsp;STOP' : '▶&nbsp;&nbsp;START';
  const mb = $('mic');
  mb.className = state.micOn ? 'on' : '';
  mb.innerHTML = state.micOn ? '●&nbsp;MIC' : 'MIC';

  renderMic();
  drawDial();
}

/* Grüne Zone (±HIT_CT) auf der ±50-ct-Skala */
$('zone').style.left = (50 - HIT_CT) + '%';
$('zone').style.width = (2 * HIT_CT) + '%';

function renderMic(){
  const panel = $('micPanel'), meter = $('meter'), cmp = $('cmp');
  panel.classList.toggle('off', !state.micOn);
  panel.classList.toggle('idle', state.micOn && sungMidi === null);
  cmp.classList.remove('hit');

  if (!state.micOn){
    $('micState').textContent = 'AUS';
    $('sungNote').textContent = '--';
    $('sungHz').textContent = '--';
    $('sungCt').textContent = '';
    meter.classList.remove('live');
    cmp.textContent = micMsg || 'MIC antippen, um zuzuhören.';
    return;
  }

  $('micState').textContent = state.playing ? 'KOPFHÖRER EMPFOHLEN' : 'HÖRT ZU';

  if (sungMidi === null){
    $('sungNote').textContent = '--';
    $('sungHz').textContent = '--';
    $('sungCt').textContent = '';
    meter.classList.remove('live');
    cmp.textContent = state.playing ? 'Singe den Ton …' : 'Singe einen Ton …';
    return;
  }

  /* Gesungener Ton wie beim Stimmgerät: nächste Note + Cent-Abweichung */
  const sm = Math.round(sungMidi);
  const ct = Math.round((sungMidi - sm) * 100);
  const sf = freqOfMidi(sungMidi);
  $('sungNote').textContent = noteName(sm);
  $('sungHz').textContent = de(sf, 1);
  $('sungCt').textContent = ct === 0 ? '±0 ct' : signed(ct, Math.abs(ct) + ' ct');
  $('needle').style.left = (50 + Math.max(-50, Math.min(50, ct))) + '%';
  meter.classList.add('live');

  if (!state.playing){
    cmp.innerHTML = '<span class="lbl">ZIEL</span>– (START für Vergleich)';
    return;
  }

  /* Vergleich mit dem gespielten Ton. Andere Oktave (z.B. Bass eine Oktave
     tiefer) wird erkannt und separat ausgewiesen. */
  const d = 1200 * Math.log2(sf / state.freq);
  const oct = Math.round(d / 1200);
  const dm = d - oct * 1200;
  const amount = Math.abs(dm) < 100
    ? Math.round(Math.abs(dm)) + ' ct'
    : de(Math.abs(dm) / 100, 1) + ' HT';
  let res;
  if (Math.abs(dm) <= HIT_CT){ res = '● GETROFFEN'; cmp.classList.add('hit'); }
  else if (dm < 0) res = '▼ ZU TIEF −' + amount;
  else res = '▲ ZU HOCH +' + amount;
  const octTxt = oct === 0 ? '' : ' · OKT ' + (oct < 0 ? '−' : '+') + Math.abs(oct);
  const target = noteName(Math.round(midiOfFreq(state.freq)));
  cmp.innerHTML = '<span class="lbl">ZIEL ' + target + '</span><span class="res">' + res + '</span>' + octTxt;
}

/* ================= Frequenz-Scrollrad ================= */
const dial = $('dial');
const dg = dial.getContext('2d');
const CPP = 3;   // Cents pro Pixel
const TICK = 25; // Feinteilung in Cents

function drawDial(){
  const dpr = window.devicePixelRatio || 1;
  const w = dial.clientWidth, h = dial.clientHeight;
  if (!w) return;
  if (dial.width !== w * dpr){ dial.width = w * dpr; dial.height = h * dpr; }
  dg.setTransform(dpr, 0, 0, dpr, 0, 0);
  dg.clearRect(0, 0, w, h);

  const ac = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  const center = 1200 * Math.log2(state.freq / FREQ_MIN);  // Cents ab C0
  const span = w * CPP;
  const maxCents = 1200 * Math.log2(FREQ_MAX / FREQ_MIN);

  /* Skala: oben Frequenz (Hz), unten Ton — Striche dazwischen */
  const TOP = 13, BOT = h - 14;
  dg.font = '8px "Chivo Mono", monospace';
  dg.textAlign = 'center';
  const first = Math.ceil((center - span / 2) / TICK) * TICK;
  for (let c = first; c <= center + span / 2; c += TICK){
    if (c < 0 || c > maxCents) continue;
    const x = w / 2 + (c - center) / CPP;
    const semi = c % 100 === 0;
    dg.strokeStyle = semi ? '#7C8C77' : '#223021';
    dg.lineWidth = 1;
    dg.beginPath();
    dg.moveTo(x, semi ? TOP : TOP + 4);
    dg.lineTo(x, semi ? BOT : BOT - 4);
    dg.stroke();
    if (semi){
      const midi = MIDI_MIN + c / 100;
      const nm = NAMES[midi % 12];
      if (nm.length === 1){  // nur Stammtöne beschriften
        const fq = freqOfMidi(midi);
        dg.fillStyle = '#7C8C77';
        dg.fillText(fq < 100 ? de(fq, 1) : String(Math.round(fq)), x, 8);
        dg.fillText(nm + (Math.floor(midi / 12) - 1), x, h - 3);
      }
    }
  }

  /* Nadel (Mitte = eingestellte Frequenz) */
  dg.strokeStyle = ac;
  dg.lineWidth = 2;
  dg.shadowColor = ac;
  dg.shadowBlur = 6;
  dg.beginPath();
  dg.moveTo(w / 2, TOP - 3);
  dg.lineTo(w / 2, BOT + 3);
  dg.stroke();
  dg.shadowBlur = 0;
}

function nudgeCents(dc){
  state.freq = clampFreq(state.freq * Math.pow(2, dc / 1200));
  onPitchChange('dial');
}

let dialDrag = false, dialX = 0;
dial.addEventListener('pointerdown', e => {
  dialDrag = true; dialX = e.clientX;
  dial.setPointerCapture(e.pointerId);
});
dial.addEventListener('pointermove', e => {
  if (!dialDrag) return;
  const dx = e.clientX - dialX; dialX = e.clientX;
  nudgeCents(-dx * CPP);       // Skala ziehen: nach links = höher
});
dial.addEventListener('pointerup', () => { dialDrag = false; });
dial.addEventListener('pointercancel', () => { dialDrag = false; });
dial.addEventListener('wheel', e => {
  e.preventDefault();
  nudgeCents((e.deltaY + e.deltaX) * 0.5);
}, { passive: false });
dial.addEventListener('dblclick', () => {
  state.freq = freqOfMidi(Math.round(midiOfFreq(state.freq)));  // auf Note einrasten
  onPitchChange('dial');
});

/* ================= Frequenz-Direkteingabe (Antippen aufs Display) =================
   Bewusst 'click' statt 'dblclick': dblclick ist auf iOS Safari unzuverlässig
   (Doppeltipp ist dort für Zoom reserviert und wird bei abgeschaltetem Zoom
   verschluckt). Ein einfacher Tap/Klick feuert auf iPhone und Mac zuverlässig,
   und focus() innerhalb des Klick-Handlers öffnet die iOS-Tastatur. */
const freqBox = document.querySelector('.scope .freq');
let freqEditing = false;
freqBox.addEventListener('click', () => {
  if (freqEditing) return;
  freqEditing = true;
  const label = $('freqVal');
  const f = state.freq;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'decimal';
  inp.id = 'freqEdit';
  inp.value = Math.abs(f - Math.round(f)) < 0.05 ? String(Math.round(f)) : de(f, 1);
  label.style.display = 'none';
  freqBox.insertBefore(inp, label);
  inp.focus();
  inp.select();

  let done = false;
  const finish = apply => {
    if (done) return;
    done = true;
    if (apply){
      const v = parseFloat(inp.value.replace(',', '.').trim());
      if (isFinite(v) && v > 0) state.freq = clampFreq(v);
    }
    inp.remove();
    label.style.display = '';
    freqEditing = false;
    onPitchChange('input');   // Anzeige neu ableiten (Note, SOLL, Cent, Rad, Klaviatur …)
  };

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
});

window.addEventListener('resize', drawDial);

/* ================= Uhr ================= */
function clock(){
  const d = new Date();
  $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
clock();
setInterval(clock, 15000);

render();
scrollToOctave(Math.floor(Math.round(midiOfFreq(state.freq)) / 12) - 1, false);
</script>
</body>
</html>
